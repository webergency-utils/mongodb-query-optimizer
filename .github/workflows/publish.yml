name: Publish

on:
  release:
    types: [ published ]

permissions: read-all

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Must match Trusted Publisher "Environment name" on npmjs.com exactly (`npm`).
    # Leave blank on npmjs.com only if you remove this key.
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Node 24 + npm ≥ 11.5.1 is what works reliably for OIDC trusted publishing.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Hash-pinned via Corepack (avoids Scorecard npmCommand / npm install -g).
      # Corepack wants semver build metadata: sha512.<hex>, not npm SRI sha512-<base64>.
      - name: Setup npm
        run: |
          corepack enable
          corepack prepare npm@11.19.0+sha512.48377f8478372aa1c4e47b763475b135836da82436a5700f2e5e8eb5084fc840f93c7b117eb3ad3b5f7d3194c81b6710a10d59448f6ddbcb21ac3fb672bdc003 --activate
          # setup-node writes _authToken=${NODE_AUTH_TOKEN}; an empty/missing token
          # makes npm skip the OIDC handshake. Strip it so trusted publishing can run.
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
            sed -i '/:_authToken=/d' "${NPM_CONFIG_USERCONFIG}"
          fi
          npm --version

      - name: Verify GitHub OIDC
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?missing — job needs permissions.id-token: write}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?missing — job needs permissions.id-token: write}"
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          sep='?'
          case "$url" in *\?*) sep='&' ;; esac
          curl -fsS "${url}${sep}audience=npm:registry.npmjs.org" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            | jq -e '.value' >/dev/null
          echo "GitHub OIDC token OK"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN — OIDC trusted publishing only.
      - name: Publish
        run: npm publish --provenance --access public

      # Scorecard Signed-Releases: attach npm's SLSA provenance DSSE to the GitHub Release.
      - name: Attach SLSA provenance to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          OUT="attestation.intoto.jsonl"
          ATTEST_URL="https://registry.npmjs.org/-/npm/v1/attestations/$(node -p "encodeURIComponent(require('./package.json').name)")@${VER}"

          echo "Waiting for npm attestations at ${ATTEST_URL}..."
          for i in $(seq 1 30); do
            if curl -fsSL "${ATTEST_URL}" -o attestations.json; then
              if jq -e '.attestations | length > 0' attestations.json >/dev/null; then
                break
              fi
            fi
            rm -f attestations.json
            sleep 10
          done

          if [ ! -f attestations.json ]; then
            echo "Timed out waiting for npm attestations"
            exit 1
          fi

          jq -c '.attestations[].bundle.dsseEnvelope' attestations.json > "${OUT}"

          if [ ! -s "${OUT}" ]; then
            echo "No DSSE envelopes found in attestations response"
            exit 1
          fi

          echo "Uploading ${OUT} to release ${TAG}"
          gh release upload "${TAG}" "${OUT}" --clobber
